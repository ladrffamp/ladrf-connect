<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agenda | LADRF Connect</title>


<link rel="stylesheet" href="styles.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


</head>


<body>



<header class="topbar">


<a href="index.html" class="btn-inicio">

<i class="fa-solid fa-house"></i>

Início

</a>




<div class="logo">


<i class="fa-solid fa-heart-pulse"></i>


<div>

<h1>
LADRF Connect
</h1>


<p>
Sistema de Gestão da Liga
</p>


</div>


</div>





<div class="usuario-info">


<strong id="nomeUsuario">

Carregando...

</strong>


<span id="perfilUsuario">

Perfil

</span>


<small id="horaAtual">

00:00:00

</small>


</div>



</header>






<main class="container">



<section class="page-title">


<h1>

📅 Agenda LADRF

</h1>


<p>

Eventos, ações e atividades da liga.

</p>


</section>







<div class="card">


<h2>

<i class="fa-solid fa-calendar-days"></i>

Agenda LADRF

</h2>





<div class="form-grid">



<div class="form-group">

<label>

Título do evento

</label>

<input 
id="titulo"
placeholder="Título do evento">

</div>





<div class="form-group">

<label>

Tipo

</label>


<select id="tipo">


<option>Atendimento</option>

<option>Curso</option>

<option>Palestra</option>

<option>Reunião</option>

<option>Treinamento</option>

<option>Ação Social</option>

<option>Outro</option>


</select>


</div>





<div class="form-group">

<label>

Data

</label>


<input 
type="date"
id="data">


</div>





<div class="form-group">

<label>

Início

</label>


<input
type="time"
id="inicio">


</div>





<div class="form-group">

<label>

Fim

</label>


<input
type="time"
id="fim">


</div>





<div class="form-group">

<label>

Local

</label>


<input
id="local"
placeholder="Local">


</div>





<div class="form-group">

<label>

Responsável

</label>


<input
id="responsavel"
placeholder="Responsável">


</div>




</div>







<div class="form-group">


<label>

Observações

</label>


<textarea

id="observacoes"

placeholder="Observações">

</textarea>


</div>






<input type="hidden" id="eventoId">






<div class="botoes">


<button

class="btn-success"

onclick="salvarEvento()">


<i class="fa-solid fa-floppy-disk"></i>


Salvar Evento


</button>



</div>




</div>







<section id="listaEventos">


</section>







</main>







<script type="module" src="agenda.js"></script>


<script type="module" src="permissoes.js"></script>






<script>


function atualizarHora(){


const hora =
document.getElementById("horaAtual");


if(hora){


hora.innerHTML =
new Date().toLocaleTimeString("pt-BR");


}


}



setInterval(atualizarHora,1000);


atualizarHora();



</script>





</body>

</html>
