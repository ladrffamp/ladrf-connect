<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agenda LADRF</title>


<link rel="stylesheet" href="styles.css">


<link rel="icon" href="logo.png">


</head>


<body>


<!-- =====================================================
     TOPO PADRÃO
===================================================== -->

<header class="topbar">

    <div class="topbar-left">

        <a href="index.html" class="btn-voltar">
            🏠 Início
        </a>

    </div>


    <div class="topbar-title">

        📅 Agenda LADRF

    </div>


    <div class="user-profile">

        <div class="user-avatar">
            U
        </div>

        <div class="user-data">

            <span class="user-name" id="nomeUsuario">
                Usuário
            </span>

            <span class="user-role" id="cargoUsuario">
                Membro
            </span>

        </div>

    </div>


</header>




<!-- =====================================================
     CONTEÚDO
===================================================== -->


<main class="main-content">


<section class="page-header">


<div>

<h1>
📅 Calendário Acadêmico Integrado
</h1>


<p>
Eventos, ações, aulas, provas e atividades da LADRF.
</p>


</div>



<button class="btn-success" id="btnNovoEvento">

➕ Novo evento

</button>



</section>



<!-- =====================================================
     ÁREA PRINCIPAL
===================================================== -->


<div class="agenda-layout">



<div class="card calendario-area">


<div class="calendar-header">


<button id="mesAnterior">
◀
</button>



<h2 id="mesAno">
Agosto 2026
</h2>



<button id="proximoMes">
▶
</button>



</div>



<div class="calendar-week">


<div>
Dom
</div>


<div>
Seg
</div>


<div>
Ter
</div>


<div>
Qua
</div>


<div>
Qui
</div>


<div>
Sex
</div>


<div>
Sáb
</div>


</div>



<div id="calendario" class="calendar-grid">


</div>



</div>


<!-- =====================================================
     LATERAL DE EVENTOS
===================================================== -->


<aside class="card agenda-lateral">


<h2>
📌 Próximos eventos
</h2>



<div id="listaProximosEventos">


<div class="empty-state">

<div class="icone">
📅
</div>


<h3>
Nenhum evento carregado
</h3>


<p>
Os próximos eventos aparecerão aqui.
</p>


</div>


</div>



</aside>



</div>




<!-- =====================================================
     FILTROS
===================================================== -->


<section class="card">


<div class="card-header">


<h2>
🔎 Filtros
</h2>


</div>



<div class="filters">


<div class="filter-item">


<label>
Categoria
</label>


<select id="filtroCategoria">


<option value="todos">
Todos
</option>


<option value="LADRF">
LADRF
</option>


<option value="Aula">
Aula
</option>


<option value="Prova">
Prova
</option>


<option value="Estágio">
Estágio
</option>


<option value="Congresso">
Congresso
</option>


<option value="Reunião">
Reunião
</option>


</select>


</div>





<div class="filter-item">


<label>
Tipo
</label>


<select id="filtroTipo">


<option value="todos">
Todos
</option>


<option value="Atendimento">
Atendimento
</option>


<option value="Evento">
Evento
</option>


<option value="Acadêmico">
Acadêmico
</option>


</select>


</div>





<div class="filter-item">


<label>
Busca
</label>


<input 
type="text"
id="buscarEvento"
placeholder="Pesquisar evento..."
>


</div>



</div>



</section>




<!-- =====================================================
     MODAL NOVO EVENTO
===================================================== -->


<div id="modalEvento" class="modal">


<div class="modal-content">


<div class="modal-header">


<h2>
📅 Novo Evento
</h2>



<span 
class="modal-close"
id="fecharModal">
✖
</span>


</div>





<form id="formEvento">



<div class="form-grid">



<div class="form-group">

<label>
Título do evento
</label>

<input 
type="text"
id="titulo"
placeholder="Ex.: Atendimento CrossFit"
required
>

</div>





<div class="form-group">

<label>
Categoria
</label>


<select id="categoria">


<option value="LADRF">
LADRF
</option>


<option value="Aula">
Aula
</option>


<option value="Prova">
Prova
</option>


<option value="Estágio">
Estágio
</option>


<option value="Congresso">
Congresso
</option>


<option value="Reunião">
Reunião
</option>


</select>


</div>





<div class="form-group">

<label>
Tipo
</label>


<select id="tipo">


<option value="Evento">
Evento
</option>


<option value="Atendimento">
Atendimento
</option>


<option value="Acadêmico">
Acadêmico
</option>


</select>


</div>





<div class="form-group">


<label>
Data
</label>


<input
type="date"
id="data"
required
>


</div>





<div class="form-group">


<label>
Início
</label>


<input
type="time"
id="inicio"
>


</div>





<div class="form-group">


<label>
Fim
</label>


<input
type="time"
id="fim"
>


</div>





<div class="form-group">


<label>
Local
</label>


<input
type="text"
id="local"
placeholder="Local do evento"
>


</div>





<div class="form-group">


<label>
Responsável
</label>


<input
type="text"
id="responsavel"
placeholder="Responsável"
>


</div>



<div class="form-group">


<label>
Disciplina
</label>


<input
type="text"
id="disciplina"
placeholder="Ex.: Traumato-Ortopedia"
>


</div>





<div class="form-group">


<label>
Professor
</label>


<input
type="text"
id="professor"
placeholder="Professor responsável"
>


</div>





<div class="form-group">


<label>
Cor do evento
</label>


<input
type="color"
id="cor"
value="#2e7d32"
>


</div>



</div>




<div class="form-group">


<label>
Observações
</label>


<textarea
id="observacoes"
placeholder="Informações adicionais..."
></textarea>


</div>




<div class="botoes">


<button 
type="submit"
class="btn-success">

💾 Salvar Evento

</button>



<button 
type="button"
id="cancelarEvento"
class="btn-danger">

Cancelar

</button>


</div>




</form>



</div>


</div>





</main>





<!-- =====================================================
     FIREBASE / JAVASCRIPT
===================================================== -->


<script type="module" src="agenda.js"></script>


</body>


</html>
