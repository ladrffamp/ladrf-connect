<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Histórico | LADRF Connect</title>


<link rel="stylesheet" href="styles.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


</head>



<body>





<header>



<a href="index.html" class="btn-inicio">


<i class="fa-solid fa-house"></i>


Início


</a>








<div class="logo">


<i class="fa-solid fa-heart-pulse"></i>



<div>


<h1>

LADRF Connect

</h1>


<p>

Sistema de Gestão da Liga

</p>


</div>



</div>







<div class="usuario">


<h3 id="nomeUsuario">

Carregando...

</h3>


<span id="perfilUsuario">

Perfil

</span>


<p id="horaAtual">

00:00:00

</p>


</div>





</header>








<main class="container">





<section class="page-title">


<h1>

<i class="fa-solid fa-clock-rotate-left"></i>

Histórico de Atendimentos

</h1>



<p>

Consulta dos atendimentos realizados pela LADRF.

</p>



</section>







<div class="card">


<h2>

Pesquisar Paciente

</h2>




<div class="flex-between">



<input

id="busca"

placeholder="Digite o nome do paciente"

>




<button

class="btn-success"

onclick="buscar()">


<i class="fa-solid fa-magnifying-glass"></i>


Buscar


</button>



</div>




</div>

<div class="card">


<h2>

Atendimentos Encontrados

</h2>





<div id="lista">


<div style="text-align:center">

Nenhum atendimento pesquisado.

</div>



</div>



</div>






</main>







<script type="module" src="historico.js"></script>


<script type="module" src="permissoes.js"></script>







<script>


function atualizarHora(){


const hora=document.getElementById("horaAtual");



if(hora){


hora.innerHTML=new Date()

.toLocaleTimeString("pt-BR");


}



}



setInterval(atualizarHora,1000);


atualizarHora();



</script>






</body>

</html>
