<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Histórico | LADRF Connect</title>


<link rel="stylesheet" href="styles.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


</head>


<body>




<header class="topbar">


<a href="index.html" class="btn-inicio">


<i class="fa-solid fa-house"></i>


Início


</a>






<div class="logo">


<i class="fa-solid fa-heart-pulse"></i>



<div>


<h1>

LADRF Connect

</h1>


<p>

Sistema de Gestão da Liga

</p>


</div>


</div>






<div class="usuario-info">


<strong id="nomeUsuario">

Carregando...

</strong>


<span id="perfilUsuario">

Perfil

</span>



<small id="horaAtual">

00:00:00

</small>



</div>



</header>









<main class="container">






<section class="page-title">


<h1>

<i class="fa-solid fa-clock-rotate-left"></i>

Histórico de Atendimentos

</h1>


<p>

Consulta dos atendimentos realizados pela LADRF.

</p>


</section>







<div class="card">



<h2>

<i class="fa-solid fa-magnifying-glass"></i>

Buscar paciente

</h2>





<div class="form-group">


<input

id="busca"

placeholder="Digite o nome do paciente">


</div>






<button

class="btn-success"

onclick="buscar()">



<i class="fa-solid fa-search"></i>


Buscar



</button>



</div>









<div class="card">


<h2>

<i class="fa-solid fa-file-medical"></i>

Atendimentos encontrados

</h2>





<div id="lista">


</div>




</div>









</main>








<script type="module" src="historico.js"></script>


<script type="module" src="permissoes.js"></script>








<script>


function atualizarHora(){


const hora=document.getElementById("horaAtual");


if(hora){


hora.innerHTML =

new Date().toLocaleTimeString("pt-BR");


}


}



setInterval(atualizarHora,1000);


atualizarHora();



</script>





</body>

</html>
