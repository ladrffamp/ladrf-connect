<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro | LADRF Connect</title>


<link rel="stylesheet" href="styles.css">


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


</head>


<body>



<header>


<a href="index.html" class="btn-inicio">


<i class="fa-solid fa-house"></i>


Início


</a>





<div class="logo">


<i class="fa-solid fa-heart-pulse"></i>


<div>


<h1>
LADRF Connect
</h1>


<p>
Sistema de Gestão da Liga
</p>


</div>


</div>






<div class="usuario">


<h3 id="nomeUsuario">

Carregando...

</h3>


<span id="perfilUsuario">

Perfil

</span>


<p id="horaAtual">

--:--:--

</p>


</div>



</header>







<main class="container">





<div class="card">



<h2>

<i class="fa-solid fa-user-plus"></i>

Cadastro de Paciente

</h2>







<form id="formCadastro">






<div class="form-group">


<label>

Nome

</label>


<input

type="text"

id="nome"

required

>


</div>







<div class="form-group">


<label>

WhatsApp

</label>


<input

type="text"

id="whatsapp"

>


</div>








<div class="form-group">


<label>

Idade

</label>


<input

type="text"

id="idade"

>


</div>








<div class="form-group">


<label>

Modalidade

</label>



<select id="modalidade" required>


<option value="">

Carregando modalidades...

</option>


</select>


</div>








<div class="form-group">


<label>

Queixa principal

</label>



<textarea

id="queixa"

placeholder="Descreva a queixa">

</textarea>


</div>







<button 
class="btn-success"
type="submit">


<i class="fa-solid fa-check"></i>


Cadastrar Paciente


</button>






</form>








<div class="card">


<h2>

<i class="fa-solid fa-qrcode"></i>

QR Code de acompanhamento

</h2>



<p>

Entregue este QR Code ao paciente para acompanhar a fila.

</p>




<div id="qrcode" class="flex-center">


</div>



</div>







</div>






</main>








<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script type="module" src="cadastro.js"></script>


<script type="module" src="permissoes.js"></script>







<script>


function atualizarHora(){


const hora =
document.getElementById("horaAtual");


if(hora){

hora.innerHTML =
new Date().toLocaleTimeString("pt-BR");

}


}


setInterval(atualizarHora,1000);


atualizarHora();



</script>






</body>

</html>
