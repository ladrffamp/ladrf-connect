<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro | LADRF Connect</title>


<link rel="stylesheet" href="styles.css">


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


</head>



<body>



<header class="topbar">


<a href="index.html" class="btn-inicio">


<i class="fa-solid fa-house"></i>


Início


</a>






<div class="logo">


<i class="fa-solid fa-heart-pulse"></i>



<div>


<h1>

LADRF Connect

</h1>


<p>

Sistema de Gestão da Liga

</p>


</div>


</div>






<div class="usuario-info">


<strong id="nomeUsuario">

Carregando...

</strong>


<span id="perfilUsuario">

Perfil

</span>


<small id="horaAtual">

--:--:--

</small>


</div>





</header>









<main class="container">





<section class="page-title">


<h1>

Cadastro de Paciente

</h1>


<p>

Registro inicial para entrada na fila de atendimento.

</p>


</section>








<div class="card">





<form id="formCadastro">





<div class="form-group">


<label>

Nome

</label>



<input

type="text"

id="nome"

placeholder="Nome completo"

required

>


</div>







<div class="form-grid">





<div class="form-group">


<label>

WhatsApp

</label>


<input

type="text"

id="whatsapp"

placeholder="(00) 00000-0000"

>


</div>







<div class="form-group">


<label>

Idade

</label>


<input

type="text"

id="idade"

placeholder="Idade"

>


</div>





</div>









<div class="form-group">


<label>

Modalidade

</label>



<select id="modalidade" required>


<option value="">

Carregando modalidades...

</option>


</select>



</div>








<div class="form-group">


<label>

Queixa principal

</label>



<textarea

id="queixa"

placeholder="Descreva a queixa principal">

</textarea>



</div>








<button 
type="submit"
class="btn-success">


<i class="fa-solid fa-user-plus"></i>


Cadastrar Paciente


</button>





</form>







<div class="card qr-box">





<h2>

<i class="fa-solid fa-qrcode"></i>

QR Code de acompanhamento

</h2>





<p>

Entregue o QR Code ao paciente para acompanhar sua posição na fila.

</p>






<div id="qrcode">


</div>





</div>








</div>







</main>








<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>



<script type="module" src="cadastro.js"></script>


<script type="module" src="permissoes.js"></script>







<script>


function atualizarHora(){


const hora = document.getElementById("horaAtual");


if(hora){


hora.innerHTML =

new Date().toLocaleTimeString("pt-BR");


}


}



setInterval(atualizarHora,1000);


atualizarHora();



</script>






</body>


</html>
