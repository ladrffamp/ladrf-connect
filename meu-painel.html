<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Painel | LADRF Connect</title>


<link rel="stylesheet" href="styles.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


</head>


<body>



<header class="topbar">


<a href="index.html" class="btn-inicio">

<i class="fa-solid fa-house"></i>

Início

</a>





<div class="logo">


<i class="fa-solid fa-heart-pulse"></i>


<div>

<h1>

LADRF Connect

</h1>


<p>

Sistema de Gestão da Liga

</p>


</div>


</div>






<div class="usuario-info">


<strong id="nomeUsuario">

Carregando...

</strong>


<span id="perfilUsuario">

Perfil

</span>


<small id="horaAtual">

00:00:00

</small>


</div>



</header>







<main class="container">





<section class="page-title">


<h1>

<i class="fa-solid fa-user"></i>

Meu Painel

</h1>


<p>

Minhas escalas e participações na LADRF.

</p>


</section>






<div class="card">


<h2>

<i class="fa-solid fa-hand-wave"></i>

Bem-vindo

</h2>


<h3 id="boasVindas">

Carregando...

</h3>


</div>








<div class="card">


<h2>

<i class="fa-solid fa-calendar-check"></i>

Minhas Escalas

</h2>




<div id="listaEscalas">


<div style="text-align:center;">

<i class="fa-solid fa-spinner fa-spin"></i>

Carregando escalas...

</div>



</div>



</div>









<div class="card">


<h2>

<i class="fa-solid fa-chart-line"></i>

Resumo de Participações

</h2>





<div class="stats">



<div class="stat">


<i class="fa-solid fa-calendar-days"></i>


<h3>

Eventos Participados

</h3>


<span id="totalEventos">

0

</span>


</div>







<div class="stat">


<i class="fa-solid fa-clock"></i>


<h3>

Horas de Participação

</h3>


<span id="totalHoras">

0h

</span>


</div>







<div class="stat">


<i class="fa-solid fa-check"></i>


<h3>

Presenças

</h3>


<span id="totalPresencas">

0

</span>


</div>




</div>


</div>




</main>







<!-- APENAS ESTES SCRIPTS -->

<script type="module" src="./meu-painel.js"></script>

<script type="module" src="./permissoes.js"></script>








<script>


function atualizarHora(){


const hora = document.getElementById("horaAtual");


if(hora){


hora.innerHTML = new Date()

.toLocaleTimeString("pt-BR");


}


}



setInterval(atualizarHora,1000);


atualizarHora();



</script>






<script type="module" src="cabecalho.js"></script>
</body>

</html>
