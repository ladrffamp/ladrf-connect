<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mural de Avisos | LADRF Connect</title>

<link rel="stylesheet" href="styles.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header class="topbar">

<a href="index.html" class="btn-inicio">
<i class="fa-solid fa-house"></i>
Início
</a>

<div class="logo">

<i class="fa-solid fa-heart-pulse"></i>

<div>

<h1>LADRF Connect</h1>

<p>Sistema de Gestão da Liga</p>

</div>

</div>

<div class="usuario-info">

<strong id="nomeUsuario">
Carregando...
</strong>

<span id="perfilUsuario">
Perfil
</span>

<small id="horaAtual">
00:00:00
</small>

</div>

</header>

<main class="container">

<section class="page-title">

<h1>

<i class="fa-solid fa-bullhorn"></i>

Mural de Avisos

</h1>

<p>

Comunicados oficiais da LADRF.

</p>

</section>

<div class="card">

<h2 id="tituloFormulario">

<i class="fa-solid fa-plus"></i>

Novo Aviso

</h2>

<div class="form-grid">

<div class="form-group">

<label>Título</label>

<input
id="titulo"
placeholder="Título do aviso">

</div>

<div class="form-group">

<label>Categoria</label>

<select id="categoria">

<option>Comunicado</option>
<option>Reunião</option>
<option>Evento</option>
<option>Treinamento</option>
<option>Escala</option>
<option>Urgente</option>

</select>

</div>

<div class="form-group">

<label>Prioridade</label>

<select id="prioridade">

<option>Baixa</option>
<option>Média</option>
<option>Alta</option>

</select>

</div>

<div class="form-group">

<label>Data do evento</label>

<input
type="date"
id="dataEvento">

</div>

<div class="form-group">

<label>Horário</label>

<input
type="time"
id="horaEvento">

</div>

<div class="form-group">

<label>Local</label>

<input
type="text"
id="localEvento"
placeholder="Ex: Arena Match Point">

</div>
<div class="form-group">

<label>

<input
type="checkbox"
id="fixado">

Fixar aviso no topo

</label>

</div>

<div class="form-group" style="grid-column:1/-1;">

<label>Mensagem</label>

<textarea
id="mensagem"
rows="6"
placeholder="Digite o comunicado"></textarea>

</div>

</div>

<div class="botoes">

<button
id="btnSalvarAviso"
class="btn-success"
onclick="salvarAviso()">

<i class="fa-solid fa-paper-plane"></i>

Publicar Aviso

</button>

<button
id="btnCancelarEdicao"
class="btn-danger"
style="display:none;"
onclick="cancelarEdicao()">

<i class="fa-solid fa-xmark"></i>

Cancelar edição

</button>

</div>

</div>

<div class="card">

<h2>

<i class="fa-solid fa-list"></i>

Avisos Publicados

</h2>

<div id="listaAvisos">

<p style="text-align:center">

Nenhum aviso publicado.

</p>

</div>

</div>

</main>
<script type="module" src="avisos.js"></script>

<script type="module" src="permissoes.js"></script>

<script>

function atualizarHora(){

const hora = document.getElementById("horaAtual");

if(hora){

hora.innerHTML =
new Date().toLocaleTimeString("pt-BR");

}

}

setInterval(
atualizarHora,
1000
);

atualizarHora();

</script>

</body>

</html>
