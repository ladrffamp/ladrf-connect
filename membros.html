<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Membros | LADRF Connect</title>

<link rel="stylesheet" href="styles.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body>


<header>


<a href="index.html" class="btn-inicio">

<i class="fa-solid fa-house"></i>

Início

</a>




<div class="logo">

<i class="fa-solid fa-heart-pulse"></i>


<div>

<h1>

LADRF Connect

</h1>

<p>

Sistema de Gestão da Liga

</p>

</div>

</div>





<div class="usuario">


<h3 id="nomeUsuario">

Carregando...

</h3>


<span id="perfilUsuario">

Perfil

</span>


<p id="horaAtual">

00:00:00

</p>


</div>


</header>





<main class="container">


<section class="page-title">


<h1>

<i class="fa-solid fa-users"></i>

Cadastro de Membros

</h1>


<p>

Gerenciamento dos integrantes da LADRF.

</p>


</section>





<div class="card">


<h2>

Novo Membro

</h2>


<div class="form-grid">


<div class="form-group">

<label>

Nome completo

</label>

<input 
id="nome"
placeholder="Nome do membro">

</div>


<div class="form-group">

<label>

E-mail

</label>

<input 
id="email"
placeholder="Email">

</div>


<div class="form-group">

<label>

Telefone

</label>

<input 
id="telefone"
placeholder="Telefone">

</div>


<div class="form-group">

<label>

Curso

</label>

<input 
id="curso"
placeholder="Curso">

</div>


<div class="form-group">

<label>

Período

</label>

<input 
id="periodo"
placeholder="Período">

</div>
<div class="form-group">

<label>

Função

</label>


<select id="funcao">


<option>

Membro

</option>


<option>

Presidente

</option>


<option>

Vice-presidente

</option>


<option>

Diretor Científico

</option>


<option>

Diretor Financeiro

</option>


<option>

Diretor de Marketing

</option>


<option>

Secretário

</option>


<option>

Orientador

</option>


</select>

</div>





<div class="form-group">


<label>

Status

</label>


<select id="status">


<option>

Ativo

</option>


<option>

Inativo

</option>


</select>


</div>


</div>





<button 
class="btn-success"
onclick="salvarMembro()">


<i class="fa-solid fa-user-plus"></i>


Cadastrar Membro


</button>



</div>








<div class="card">


<h2>

Membros Cadastrados

</h2>



<div class="table-responsive">



<table>


<thead>


<tr>


<th>

Nome

</th>


<th>

Função

</th>


<th>

Status

</th>


<th>

Ações

</th>


</tr>


</thead>



<tbody id="listaMembros">


<tr>

<td colspan="4" style="text-align:center">

Carregando membros...

</td>

</tr>


</tbody>



</table>



</div>



</div>





</main>
<script type="module" src="membros.js"></script>

<script type="module" src="permissoes.js"></script>


<script>

function atualizarHora(){

const hora = document.getElementById("horaAtual");


if(hora){

hora.innerHTML = new Date()

.toLocaleTimeString("pt-BR");

}

}


setInterval(atualizarHora,1000);

atualizarHora();


</script>


<script type="module" src="cabecalho.js"></script>
</body>

</html>
