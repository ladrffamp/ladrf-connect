<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel | LADRF Connect</title>


<link rel="stylesheet" href="styles.css">


<link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<style>


body{

background:#111 !important;

color:white;

min-height:100vh;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

padding:30px;

}



/* BOTÃO INÍCIO */

.btn-inicio{

position:fixed;

top:20px;

left:20px;

z-index:9999;

background:#0B7A3B;

color:white;

padding:12px 20px;

border-radius:10px;

font-weight:bold;

}



/* LOGO */

.painel-logo{

font-size:45px;

font-weight:700;

color:white;

text-align:center;

margin-bottom:15px;

}



/* HORA */

#horaAtual{

font-size:45px;

font-weight:bold;

color:#15A34A;

margin-bottom:35px;

letter-spacing:3px;

}



/* PACIENTE */

.chamado{

width:90%;

max-width:1200px;

background:#222;

border-radius:25px;

padding:50px;

text-align:center;

box-shadow:0 15px 40px rgba(0,0,0,.5);

}



.chamado h2{

color:white;

font-size:28px;

margin-bottom:20px;

}



.nome{

font-size:70px;

font-weight:700;

color:white;

margin:30px;

}



.maca{

font-size:40px;

font-weight:bold;

color:#15A34A;

}



/* FILA */

.proximos{

width:90%;

max-width:1200px;

background:#222;

border-radius:25px;

padding:35px;

margin-top:30px;

box-shadow:0 15px 40px rgba(0,0,0,.5);

}



.proximos h2{

color:white;

margin-bottom:20px;

}



.proximos ul{

list-style:none;

padding:0;

}



.proximos li{

color:white;

font-size:28px;

padding:15px;

border-bottom:1px solid #444;

}



/* RESPONSIVO */

@media(max-width:700px){


.painel-logo{

font-size:32px;

}


#horaAtual{

font-size:32px;

}


.nome{

font-size:40px;

}


.maca{

font-size:28px;

}


.proximos li{

font-size:20px;

}


}


</style>


</head>



<body>




<a href="index.html" class="btn-inicio">

<i class="fa-solid fa-house"></i>

Início

</a>





<div class="painel-logo">

LADRF CONNECT

</div>





<div id="horaAtual">

00:00:00

</div>







<div class="chamado">


<h2>

Paciente em Atendimento

</h2>



<div class="nome" id="nome">

Nenhum

</div>



<div class="maca" id="maca">

-

</div>



</div>







<div class="proximos">


<h2>

Fila de Espera

</h2>



<ul id="fila">


</ul>



</div>







<script type="module" src="painel.js"></script>




<script>


function atualizarHora(){


const hora=document.getElementById("horaAtual");


if(hora){

hora.innerHTML=new Date()

.toLocaleTimeString("pt-BR");

}


}



setInterval(atualizarHora,1000);


atualizarHora();



</script>





</body>

</html>
