<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificados | LADRF Connect</title>


<link rel="stylesheet" href="styles.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


</head>


<body>



<header class="topbar">


<a href="index.html" class="btn-inicio">

<i class="fa-solid fa-house"></i>

Início

</a>




<div class="logo">


<i class="fa-solid fa-heart-pulse"></i>


<div>

<h1>

LADRF Connect

</h1>


<p>

Sistema de Gestão da Liga

</p>


</div>


</div>





<div class="usuario-info">


<strong id="nomeUsuario">

Carregando...

</strong>


<span id="perfilUsuario">

Perfil

</span>


<small id="horaAtual">

00:00:00

</small>


</div>



</header>






<main class="container">





<section class="page-title">


<h1>

<i class="fa-solid fa-certificate"></i>

Certificados

</h1>


<p>

Emissão e controle de certificados da LADRF.

</p>


</section>




<div class="card">


<h2>

<i class="fa-solid fa-file-circle-plus"></i>

Gerar Certificado

</h2>



<div class="form-grid">

<div class="form-group">


<label>

Membro

</label>


<select id="membro">


<option>

Carregando membros...

</option>


</select>



</div>



<div class="form-group">


<label>

Evento

</label>


<select id="evento">


<option>

Carregando eventos...

</option>


</select>


</div>



<div class="form-group">


<label>

Carga horária

</label>


<input

id="cargaHoraria"

placeholder="Ex: 10 horas">


</div>


</div>
<div class="botoes">


<button 
class="btn-success"
id="gerarCertificado">


<i class="fa-solid fa-file-pdf"></i>


Gerar Certificado PDF


</button>





<button 
class="btn-primary"
id="emitirTodos">


<i class="fa-solid fa-users"></i>


Emitir para todos os membros


</button>



</div>



</div>







<div class="card">


<h2>

<i class="fa-solid fa-list"></i>

Certificados Emitidos

</h2>





<div class="table-responsive">



<table>



<thead>


<tr>


<th>

Nome

</th>



<th>

Evento

</th>



<th>

Carga Horária

</th>



<th>

Data

</th>



<th>

Ação

</th>


</tr>



</thead>





<tbody id="listaCertificados">



<tr>


<td colspan="5" style="text-align:center;">


Nenhum certificado emitido.


</td>


</tr>



</tbody>




</table>




</div>



</div>






</main>






<script type="module" src="certificados.js"></script>


<script type="module" src="permissoes.js"></script>




<script>


function atualizarHora(){


const hora = document.getElementById("horaAtual");



if(hora){


hora.innerHTML = new Date()

.toLocaleTimeString("pt-BR");


}



}



setInterval(atualizarHora,1000);


atualizarHora();



</script>




</body>

</html>
