<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LADRF Connect - Painel</title>


<link rel="stylesheet" href="styles.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


</head>


<body>



<header class="topbar">


<a href="index.html" class="btn-inicio">

<i class="fa-solid fa-house"></i>

Início

</a>



<div class="logo">


<i class="fa-solid fa-heart-pulse"></i>


<div>

<h1>

LADRF Connect

</h1>


<p>

Sistema de Gestão da Liga

</p>


</div>


</div>





<div class="usuario-info">


<strong id="nomeUsuario">

Carregando...

</strong>


<span id="perfilUsuario">

Perfil

</span>


<small id="horaAtual">

00:00:00

</small>


</div>



</header>






<main class="container">



<section class="page-title">


<h1>

Painel de Atendimento LADRF Connect

</h1>


<p>

Acompanhamento dos atendimentos em tempo real.

</p>


</section>







<section class="cards">





<div class="card">


<i class="fa-solid fa-clock"></i>


<h3>

Aguardando

</h3>


<div id="aguardando" class="numero">

0

</div>


</div>







<div class="card">


<i class="fa-solid fa-user-doctor"></i>


<h3>

Em atendimento

</h3>


<div id="atendimento" class="numero">

0

</div>


</div>







<div class="card">


<i class="fa-solid fa-bed"></i>


<h3>

Macas livres

</h3>


<div id="livres" class="numero">

0

</div>


</div>







<div class="card">


<i class="fa-solid fa-bed-pulse"></i>


<h3>

Macas ocupadas

</h3>


<div id="ocupadas" class="numero">

0

</div>


</div>





</section>








<div class="card">



<h2>

Pacientes em atendimento

</h2>





<div class="table-responsive">


<table>


<thead>


<tr>


<th>

Paciente

</th>


<th>

Maca

</th>


<th>

Modalidade

</th>


</tr>


</thead>




<tbody id="listaAtendimento">

</tbody>



</table>


</div>



</div>







</main>









<script type="module" src="dashboard.js"></script>




<script>


function atualizarHora(){


const hora = document.getElementById("horaAtual");


if(hora){

hora.innerHTML =
new Date().toLocaleTimeString("pt-BR");

}


}



setInterval(atualizarHora,1000);


atualizarHora();



</script>




</body>

</html>
