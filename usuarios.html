<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Usuários | LADRF Connect</title>


<link rel="stylesheet" href="styles.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


</head>



<body>


<header>


<a href="index.html" class="btn-inicio">

<i class="fa-solid fa-house"></i>

Início

</a>




<div class="logo">


<i class="fa-solid fa-heart-pulse"></i>


<div>


<h1>

LADRF Connect

</h1>


<p>

Sistema de Gestão da Liga

</p>


</div>


</div>





<div class="usuario">


<h3 id="nomeUsuario">

Carregando...

</h3>


<span id="perfilUsuario">

Perfil

</span>


<p id="horaAtual">

00:00:00

</p>


</div>



</header>






<main class="container">



<section class="page-title">


<h1>

🔐 Gerenciamento de Usuários

</h1>



<p>

Controle de acessos e permissões do sistema.

</p>



</section>






<!-- CADASTRO DE USUÁRIO -->


<div class="card">


<h2>

<i class="fa-solid fa-user-plus"></i>

Cadastrar Usuário

</h2>




<div class="form-grid">



<div class="input-group">


<label>

Nome

</label>


<input

type="text"

id="nomeUsuarioNovo"

placeholder="Nome completo">


</div>





<div class="input-group">


<label>

E-mail

</label>


<input

type="email"

id="emailUsuarioNovo"

placeholder="email@exemplo.com">


</div>





<div class="input-group">


<label>

Senha

</label>


<input

type="password"

id="senhaUsuarioNova"

placeholder="Mínimo 6 caracteres">


</div>





<div class="input-group">


<label>

Perfil

</label>



<select id="perfilUsuarioNovo">


<option value="membro">

Membro

</option>


<option value="recepcao">

Recepção

</option>


<option value="admin">

Administrador

</option>


</select>


</div>



</div>






<button

id="btnCadastrarUsuario"

class="btn-primary">


<i class="fa-solid fa-user-plus"></i>


Cadastrar Usuário


</button>



</div>







<!-- LISTA DE USUÁRIOS -->


<div class="card">



<div class="table-responsive">



<table>



<thead>


<tr>


<th>

Nome

</th>



<th>

Email

</th>



<th>

Perfil

</th>



<th>

Ação

</th>



</tr>


</thead>





<tbody id="listaUsuarios">


</tbody>




</table>



</div>



</div>







</main>







<script type="module" src="usuarios.js"></script>


<script type="module" src="permissoes.js"></script>







<script>


function atualizarHora(){


const hora = document.getElementById("horaAtual");



if(hora){


hora.innerHTML = new Date()

.toLocaleTimeString("pt-BR");


}


}



setInterval(atualizarHora,1000);


atualizarHora();



</script>







</body>

</html>
