<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modalidades | LADRF Connect</title>


<link rel="stylesheet" href="styles.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


</head>


<body>



<header class="topbar">


<a href="index.html" class="btn-inicio">

<i class="fa-solid fa-house"></i>

Início

</a>





<div class="logo">


<i class="fa-solid fa-heart-pulse"></i>


<div>

<h1>

LADRF Connect

</h1>


<p>

Sistema de Gestão da Liga

</p>


</div>


</div>





<div class="usuario-info">


<strong id="nomeUsuario">

Carregando...

</strong>


<span id="perfilUsuario">

Perfil

</span>


<small id="horaAtual">

00:00:00

</small>


</div>



</header>







<main class="container">





<section class="page-title">


<h1>

<i class="fa-solid fa-person-running"></i>

Modalidades Esportivas

</h1>


<p>

Cadastro e gerenciamento das modalidades atendidas pela LADRF.

</p>


</section>






<div class="card">


<h2>

<i class="fa-solid fa-plus"></i>

Nova Modalidade

</h2>





<div class="form-grid">



<div class="form-group">


<label>

Nome da modalidade

</label>


<input

id="nomeModalidade"

placeholder="Ex: Futebol">


</div>





<div class="form-group">


<label>

Descrição

</label>


<input

id="descricao"

placeholder="Descrição da modalidade">


</div>



</div>
<div class="botoes">


<button 
class="btn-success"
id="salvarModalidade">


<i class="fa-solid fa-floppy-disk"></i>


Salvar Modalidade


</button>



</div>



</div>







<div class="card">


<h2>

<i class="fa-solid fa-list"></i>

Modalidades Cadastradas

</h2>






<div class="table-responsive">


<table>



<thead>


<tr>


<th>

Nome

</th>



<th>

Descrição

</th>



<th>

Status

</th>



<th>

Ações

</th>


</tr>


</thead>




<tbody id="listaModalidades">


<tr>


<td colspan="4" style="text-align:center;">


Carregando modalidades...


</td>


</tr>



</tbody>




</table>



</div>



</div>
</main>






<script type="module" src="modalidades.js"></script>


<script type="module" src="permissoes.js"></script>







<script>


function atualizarHora(){


const hora = document.getElementById("horaAtual");



if(hora){


hora.innerHTML = new Date()

.toLocaleTimeString("pt-BR");


}



}



setInterval(atualizarHora,1000);


atualizarHora();



</script>





</body>

</html>
